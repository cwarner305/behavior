<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behavior Lab Practice Game</title>
<style>
:root{
  --black:#111;
  --gold:#C9A23F;
  --cream:#fbfaf5;
  --gray:#eef0f2;
  --darkgray:#555;
  --green:#1f7a4d;
  --red:#a33434;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--cream);
  color:var(--black);
  line-height:1.5;
}
header{
  background:var(--black);
  color:#fff;
  padding:18px 20px;
  border-bottom:6px solid var(--gold);
}
header h1{margin:0;font-size:clamp(1.5rem,3vw,2.2rem)}
header p{margin:4px 0 0;color:#e7e7e7}
main{max-width:1050px;margin:0 auto;padding:22px}
.card{
  background:white;
  border:1px solid #d9d9d9;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.mode-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}
.mode-btn{
  width:100%;
  min-height:160px;
  border:2px solid #222;
  border-radius:14px;
  background:#fff;
  text-align:left;
  padding:18px;
  cursor:pointer;
  font-size:1rem;
}
.mode-btn:hover,.mode-btn:focus{
  border-color:var(--gold);
  outline:3px solid rgba(201,162,63,.2);
}
.mode-btn h2{margin:0 0 8px}
.section-kicker{font-size:.85rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#555;margin:18px 0 8px}
.advanced-wrap{margin-top:22px;padding-top:18px;border-top:2px solid #e2e2e2}
.advanced-btn{min-height:190px;border-color:var(--gold);background:#fffdf6}
.advanced-grid{display:grid;grid-template-columns:1fr;gap:16px}
.advanced-story{font-size:1.08rem;line-height:1.7}
.advanced-section{border-top:1px solid #ddd;margin-top:22px;padding-top:18px}
.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.check-choice{display:flex;gap:9px;align-items:flex-start;border:1px solid #ccc;border-radius:9px;padding:10px;background:#fff}
.check-choice input{margin-top:4px}
.pick-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
.pick-columns.two{grid-template-columns:repeat(2,1fr)}
.pick-map-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:10px}
.pick-column{background:#fcfcfc;border:1px solid #ddd;border-radius:12px;padding:12px}
.pick-column h4{margin:0 0 10px;font-size:1rem}
.pick-stack{display:grid;gap:8px}
.pick-card{width:100%;text-align:left;padding:11px 12px;border:2px solid #ccc;border-radius:10px;background:white;cursor:pointer;font-size:.98rem;line-height:1.35}
.pick-card:hover{border-color:#777}
.pick-card.selected{border-color:var(--gold);background:#fff9e8}
.pick-card.correct{border-color:var(--green);background:#eaf7f0}
.pick-card.incorrect{border-color:var(--red);background:#faecec}
.pick-card:disabled{cursor:default;opacity:1}
@media(max-width:900px){.pick-columns{grid-template-columns:1fr}.pick-columns.two,.pick-map-grid{grid-template-columns:1fr}}
@media(max-width:760px){.check-grid{grid-template-columns:1fr}}
.tag{
  display:inline-block;
  background:var(--gold);
  color:#111;
  font-weight:700;
  border-radius:999px;
  padding:3px 9px;
  font-size:.8rem;
  margin-bottom:10px;
}
.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.progress-wrap{flex:1;min-width:230px}
.progress{
  height:13px;
  border-radius:999px;
  background:#ddd;
  overflow:hidden;
}
.progress > div{height:100%;background:var(--gold);width:0%}
.statline{font-weight:700;font-size:.95rem}
.case-title{font-size:1.15rem;margin:0 0 8px}
.case-text{
  background:#f7f7f7;
  border-left:5px solid var(--gold);
  padding:16px;
  border-radius:8px;
  font-size:1.06rem;
}
.question{margin:20px 0 8px;font-weight:700}
.options{
  display:grid;
  gap:10px;
}
.option{
  width:100%;
  text-align:left;
  padding:13px 14px;
  border:2px solid #ccc;
  border-radius:10px;
  background:white;
  cursor:pointer;
  font-size:1rem;
}
.option:hover{border-color:#777}
.option.selected{
  border-color:var(--gold);
  background:#fff9e8;
}
.option.correct{
  border-color:var(--green);
  background:#eaf7f0;
}
.option.incorrect{
  border-color:var(--red);
  background:#fdecec;
}
button.action{
  border:none;
  border-radius:10px;
  padding:12px 16px;
  font-weight:700;
  cursor:pointer;
  margin-top:16px;
  background:var(--black);
  color:#fff;
}
button.action.secondary{
  background:#fff;
  color:#111;
  border:2px solid #111;
}
button.action:disabled{opacity:.45;cursor:not-allowed}
.feedback{
  margin-top:16px;
  padding:15px;
  border-radius:10px;
  background:#f4f4f4;
  border-left:5px solid var(--gold);
}
.feedback.good{border-left-color:var(--green)}
.feedback.bad{border-left-color:var(--red)}
.feedback h3{margin:0 0 5px}
.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
select{
  width:100%;
  padding:11px;
  border:2px solid #bbb;
  border-radius:8px;
  background:white;
  font-size:1rem;
}
.labelrow{margin-bottom:12px}
.labelrow label{display:block;font-weight:700;margin-bottom:5px}
.small{font-size:.9rem;color:var(--darkgray)}
.hidden{display:none!important}
.pill{
  background:#eee;
  border-radius:999px;
  padding:5px 10px;
  font-size:.9rem;
}
footer{padding:30px 0 10px;color:#666;font-size:.85rem;text-align:center}
@media(max-width:760px){
  .mode-grid,.two-col{grid-template-columns:1fr}
  main{padding:14px}
  .card{padding:15px}
}
</style>
</head>
<body>
<header>
  <h1>Behavior Lab</h1>
  <p>Practice identifying conditioning and behavior concepts from real-world cases.</p>
</header>

<main>
<section id="home">
  <div class="card">
    <span class="tag">125 total cases</span>
    <h2>Behavior Lab Practice</h2>
    <p>Build the basics first, then combine everything in Advanced Behavior Analysis.</p>

    <div class="section-kicker">Basics</div>
    <div class="mode-grid">
      <button class="mode-btn" onclick="startMode('classical')">
        <h2>Classical Conditioning</h2>
        <p>Identify the NS, UCS, UCR, CS, and CR in short conditioning situations.</p>
      </button>
      <button class="mode-btn" onclick="startMode('operant')">
        <h2>Operant Conditioning</h2>
        <p>Identify reinforcement or punishment and strategies such as shaping, extinction, token economies, and the Premack principle.</p>
      </button>
      <button class="mode-btn" onclick="startMode('abc')">
        <h2>ABCs of Behavior</h2>
        <p>Read a realistic paragraph and identify the antecedent, behavior, and consequence.</p>
      </button>
    </div>

    <div class="advanced-wrap">
      <div class="section-kicker">Advanced</div>
      <div class="advanced-grid">
        <button class="mode-btn advanced-btn" onclick="startMode('advanced')">
          <span class="tag">35 complex cases</span>
          <h2>Advanced Behavior Analysis</h2>
          <p>Read a longer real-world story. Identify the ABC sequence, determine whether classical conditioning is operating and map it when present, then identify every operant process supported by the evidence.</p>
        </button>
      </div>
    </div>
  </div>
</section>

<section id="game" class="hidden">
  <div class="topbar">
    <button class="action secondary" onclick="goHome()">Back to modes</button>
    <div class="progress-wrap">
      <div class="statline" id="modeLabel"></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
    <div class="pill" id="scoreLabel">Score: 0/0</div>
  </div>

  <div class="card">
    <div class="small" id="caseNumber"></div>
    <h2 class="case-title" id="caseTitle"></h2>
    <div class="case-text" id="caseText"></div>

    <div id="classicalArea" class="hidden"></div>
    <div id="mcArea" class="hidden"></div>

    <div id="feedback" class="feedback hidden"></div>

    <button id="checkBtn" class="action" onclick="checkAnswer()">Check answer</button>
    <button id="nextBtn" class="action hidden" onclick="nextCase()">Next case</button>
  </div>
</section>

<footer>Behavior Lab Practice Game</footer>
</main>

const operantCases = [
{title:"Homework Streak",text:"A student earns 10 minutes of game time each evening after completing all assigned homework. Homework completion increases over the next month.",type:"Positive reinforcement",strategy:"Premack principle",why:"A desirable activity is added after homework, increasing homework completion. The preferred activity is used to reinforce the less-preferred activity."},

    "A": "An official makes a call Kira dislikes during a game.",
    "B": "Kira gives a brief respectful response and returns to play rather than continuing to argue.",
    "C": "Appropriate responding receives praise, while prolonged arguing results in loss of playing time.",
    "classical": false,
    "cmap": null,
    "operant": [
      "Positive reinforcement",
      "Negative punishment",
      "Response cost",
      "Differential reinforcement"
    ],
    "why": "Appropriate behavior is reinforced, while prolonged arguing removes access to playing time, a response-cost form of negative punishment."
  }
];

let currentMode = null;
let deck = [];
let index = 0;
let score = 0;
let attempts = 0;
let selected = null;
let currentPrompt = null;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startMode(mode){
  currentMode=mode;
  const source = mode==="classical" ? classicalCases :
    mode==="operant" ? operantCases :
    mode==="abc" ? abcCases : advancedCases;
  deck=shuffle(source);
  index=0;score=0;attempts=0;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("modeLabel").textContent =
    mode==="classical"?"Classical Conditioning":
    mode==="operant" ? "Operant Conditioning" :
    mode==="abc" ? "ABCs of Behavior" : "Advanced Behavior Analysis";
  renderCase();
}

function goHome(){
  document.getElementById("game").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
}

function renderCase(){
  selected=null;
  currentPrompt=null;
  document.getElementById("feedback").className="feedback hidden";
  document.getElementById("feedback").innerHTML="";
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("checkBtn").classList.remove("hidden");
  document.getElementById("checkBtn").disabled=false;

  const c=deck[index];
  document.getElementById("caseNumber").textContent=`Case ${index+1} of ${deck.length}`;
  document.getElementById("caseTitle").textContent=c.title;
  document.getElementById("caseText").textContent=c.text;
  document.getElementById("caseText").classList.toggle("advanced-story",currentMode==="advanced");
  document.getElementById("progressBar").style.width=`${(index/deck.length)*100}%`;
  document.getElementById("scoreLabel").textContent=`Score: ${score}/${attempts}`;

  if(currentMode==="classical"){
    document.getElementById("classicalArea").classList.remove("hidden");
    document.getElementById("mcArea").classList.add("hidden");
    renderClassical(c);
  } else {
    document.getElementById("classicalArea").classList.add("hidden");
    document.getElementById("mcArea").classList.remove("hidden");
    if(currentMode==="operant") renderOperant(c);
    else if(currentMode==="abc") renderABC(c);
    else renderAdvanced(c);
  }
}

function renderClassical(c){
  const labels=[
    ["NS","Neutral Stimulus (before learning)"],
    ["UCS","Unconditioned Stimulus"],
    ["UCR","Unconditioned Response"],
    ["CS","Conditioned Stimulus (after learning)"],
    ["CR","Conditioned Response"]
  ];
  const values=shuffle(Object.values(c.map));
  let html=`<p class="question">Identify each part of the conditioning process.</p><div class="two-col">`;
  labels.forEach(([key,label])=>{
    html+=`<div class="labelrow"><label>${key}: ${label}</label><select id="sel_${key}"><option value="">Choose...</option>`;
    values.forEach(v=>html+=`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`);
    html+=`</select></div>`;
  });
  html+=`</div><p class="small">Tip: the NS and CS are usually the same stimulus at different points in learning.</p>`;
  document.getElementById("classicalArea").innerHTML=html;
}

const consequenceTypes=["Positive reinforcement","Negative reinforcement","Positive punishment","Negative punishment","Extinction"];
const strategyTypes=["Premack principle","Escape learning","Response cost","Overcorrection","Shaping","Token economy","Extinction","Differential reinforcement","Positive punishment","Discrimination training"];

function renderOperant(c){
  const askStrategy = Math.random() < .5;
  currentPrompt = askStrategy ? "strategy" : "type";
  let options = askStrategy ? strategyTypes : consequenceTypes;
  let correct = askStrategy ? c.strategy : c.type;
  const distractors = shuffle(options.filter(x=>x!==correct)).slice(0,3);
  const choices=shuffle([correct,...distractors]);
  const q = askStrategy
    ? "Which operant-conditioning strategy is most clearly being used?"
    : "Which consequence pattern best describes what is happening?";
  renderMC(q,choices,correct);
}

function renderABC(c){
  const target = shuffle(["A","B","C"])[0];
  currentPrompt=target;
  const labels={A:"antecedent",B:"behavior",C:"consequence"};
  const correct=c[target];
  const pool=[c.A,c.B,c.C];
  // Add one plausible but incorrect interpretation.
  const extra =
    target==="A" ? "What the person was probably thinking before the event." :
    target==="B" ? "A personality trait that might explain the action." :
    "What could happen later if the same pattern continues.";
  const choices=shuffle([...pool,extra]);
  renderMC(`Which part of the case is the ${labels[target]}?`,choices,correct);
}

function renderMC(question,choices,correct){
  currentPrompt={key:currentPrompt,correct};
  let html=`<p class="question">${question}</p><div class="options">`;
  choices.forEach((choice,i)=>{
    html+=`<button class="option" data-value="${escapeHtml(choice)}" onclick="selectOption(this)">${String.fromCharCode(65+i)}. ${escapeHtml(choice)}</button>`;
  });
  html+=`</div>`;
  document.getElementById("mcArea").innerHTML=html;
}


function buildPickCards(group, values, multi=false){
  return values.map(v=>`<button type="button" class="pick-card${multi?" multi":""}" data-${multi?"multi":"group"}="${group}" data-value="${escapeHtml(v)}" onclick="${multi?"togglePick(this)":"selectPick(this)"}">${escapeHtml(v)}</button>`).join("");
}

function getGroupValue(group){
  return document.querySelector(`.pick-card[data-group="${group}"].selected`)?.dataset.value || "";
}

function getMultiValues(group){
  return [...document.querySelectorAll(`.pick-card[data-multi="${group}"].selected`)].map(btn=>btn.dataset.value);
}

function selectPick(btn){
  const group=btn.dataset.group;
  document.querySelectorAll(`.pick-card[data-group="${group}"]`).forEach(el=>el.classList.remove("selected"));
  btn.classList.add("selected");
  if(group==="advClassicalPresent") toggleAdvancedClassical();
}

function togglePick(btn){
  btn.classList.toggle("selected");
}

function renderAdvanced(c){
  document.getElementById("caseText").classList.add("advanced-story");
  const abcValues=shuffle([
    c.A,c.B,c.C,
    "A likely thought or feeling that is not directly observable.",
    "A possible long-term outcome that is not the immediate consequence."
  ]);
  const classicalValues = c.classical
    ? shuffle(Object.values(c.cmap))
    : shuffle([
        "A neutral cue that never became reliably paired with a reflexive event.",
        "An event that might be upsetting but does not show a clear conditioned pairing.",
        "A response that is better explained by choice or consequences than by reflexive conditioning.",
        c.A,c.B,c.C
      ]);
  const allOperant=[...new Set([...consequenceTypes,...strategyTypes])];

  let html=`<div class="advanced-section"><h3>1. Identify the ABC sequence</h3>
    <p class="small">Click one answer in each column.</p>
    <div class="pick-columns">
      <div class="pick-column"><h4>Antecedent</h4><div class="pick-stack">${buildPickCards("advA",abcValues)}</div></div>
      <div class="pick-column"><h4>Behavior</h4><div class="pick-stack">${buildPickCards("advB",abcValues)}</div></div>
      <div class="pick-column"><h4>Consequence</h4><div class="pick-stack">${buildPickCards("advC",abcValues)}</div></div>
    </div></div>`;

  html+=`<div class="advanced-section"><h3>2. Classical conditioning</h3>
    <p class="small">First decide whether the story supports a classical-conditioning relationship.</p>
    <div class="pick-columns two">
      <div class="pick-column"><h4>Is classical conditioning present?</h4><div class="pick-stack">${buildPickCards("advClassicalPresent",[
        "yes","no"
      ]).replace('>yes<','>Yes — classical conditioning is present<').replace('>no<','>No — classical conditioning is not supported<')}</div></div>
      <div class="pick-column"><h4>Reminder</h4><p class="small">Only map NS, UCS, UCR, CS, and CR if the case actually shows a learned stimulus pairing that creates a reflexive or emotional response.</p></div>
    </div>
    <div id="advClassicalMap" class="hidden">
      <div class="pick-map-grid">
        <div class="pick-column"><h4>NS</h4><div class="pick-stack">${buildPickCards("adv_NS",classicalValues)}</div></div>
        <div class="pick-column"><h4>UCS</h4><div class="pick-stack">${buildPickCards("adv_UCS",classicalValues)}</div></div>
        <div class="pick-column"><h4>UCR</h4><div class="pick-stack">${buildPickCards("adv_UCR",classicalValues)}</div></div>
        <div class="pick-column"><h4>CS</h4><div class="pick-stack">${buildPickCards("adv_CS",classicalValues)}</div></div>
        <div class="pick-column"><h4>CR</h4><div class="pick-stack">${buildPickCards("adv_CR",classicalValues)}</div></div>
      </div>
    </div></div>`;

  html+=`<div class="advanced-section"><h3>3. Operant conditioning</h3>
    <p class="small">Click <strong>all</strong> operant processes that are clearly supported by the story.</p>
    <div class="pick-map-grid">`;
  allOperant.forEach(v=>{
    html+=`<button type="button" class="pick-card multi" data-multi="advOp" data-value="${escapeHtml(v)}" onclick="togglePick(this)">${escapeHtml(v)}</button>`;
  });
  html+=`</div></div>`;
  document.getElementById("mcArea").innerHTML=html;
}

function toggleAdvancedClassical(){
  const v=getGroupValue("advClassicalPresent");
  const map=document.getElementById("advClassicalMap");
  if(map) map.classList.toggle("hidden",v!=="yes");
}

function arraysEqualAsSets(a,b){
  const aa=[...new Set(a)].sort();
  const bb=[...new Set(b)].sort();
  return aa.length===bb.length && aa.every((v,i)=>v===bb[i]);
}

function selectOption(btn){
  document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected");
  selected=btn.dataset.value;
}

function markSingleGroup(group, correctValue, selectedValue){
  document.querySelectorAll(`.pick-card[data-group="${group}"]`).forEach(btn=>{
    if(btn.dataset.value===correctValue) btn.classList.add("correct");
    else if(selectedValue && btn.dataset.value===selectedValue && selectedValue!==correctValue) btn.classList.add("incorrect");
    btn.disabled=true;
  });
}

function markMultiGroup(group, correctValues, selectedValues){
  const correctSet=new Set(correctValues);
  const selectedSet=new Set(selectedValues);
  document.querySelectorAll(`.pick-card[data-multi="${group}"]`).forEach(btn=>{
    const value=btn.dataset.value;
    if(correctSet.has(value)) btn.classList.add("correct");
    else if(selectedSet.has(value)) btn.classList.add("incorrect");
    btn.disabled=true;
  });
}

function checkAnswer(){
  const c=deck[index];
  let correct=false;
  attempts++;

  if(currentMode==="classical"){
    const keys=["NS","UCS","UCR","CS","CR"];
    const results=keys.map(k=>{
      const chosen=document.getElementById(`sel_${k}`).value;
      return {k,chosen,correct:c.map[k],ok:chosen===c.map[k]};
    });
    correct=results.every(r=>r.ok);
    if(correct) score++;
    const misses=results.filter(r=>!r.ok);
    const feedback=document.getElementById("feedback");
    feedback.className=`feedback ${correct?"good":"bad"}`;
    feedback.innerHTML=correct
      ? `<h3>Correct</h3><p>You identified all five parts of the conditioning sequence.</p>`
      : `<h3>Not quite</h3><p>${misses.length} item${misses.length===1?"":"s"} need another look.</p>
         <ul>${results.map(r=>`<li><strong>${r.k}:</strong> ${escapeHtml(r.correct)} ${r.ok?"":"(review this one)"}</li>`).join("")}</ul>
         <p><strong>Reasoning:</strong> The UCS naturally produces the UCR. The NS begins neutral; after pairing with the UCS, it becomes the CS and produces the CR.</p>`;
  } else if(currentMode==="advanced"){
    const abc={A:getGroupValue("advA"),B:getGroupValue("advB"),C:getGroupValue("advC")};
    const present=getGroupValue("advClassicalPresent");
    const selectedOps=getMultiValues("advOp");
    if(!abc.A || !abc.B || !abc.C || !present){
      attempts--;
      alert("Complete the ABC choices and the classical-conditioning decision before checking your answer.");
      return;
    }

    const abcOK=abc.A===c.A && abc.B===c.B && abc.C===c.C;
    let classicalOK=(present===(c.classical?"yes":"no"));
    const classDetails=[];

    if(c.classical){
      if(present!=="yes") classicalOK=false;
      ["NS","UCS","UCR","CS","CR"].forEach(k=>{
        const chosen=getGroupValue(`adv_${k}`);
        const ok=chosen===c.cmap[k];
        classDetails.push({k,chosen,correct:c.cmap[k],ok});
        if(!ok) classicalOK=false;
      });
    } else if(present==="yes"){
      classicalOK=false;
    }

    const opOK=arraysEqualAsSets(selectedOps,c.operant);
    correct=abcOK && classicalOK && opOK;
    if(correct) score++;

    markSingleGroup("advA",c.A,abc.A);
    markSingleGroup("advB",c.B,abc.B);
    markSingleGroup("advC",c.C,abc.C);
    markSingleGroup("advClassicalPresent",c.classical?"yes":"no",present);
    if(c.classical){
      ["NS","UCS","UCR","CS","CR"].forEach(k=>markSingleGroup(`adv_${k}`,c.cmap[k],getGroupValue(`adv_${k}`)));
    }
    markMultiGroup("advOp",c.operant,selectedOps);

    const feedback=document.getElementById("feedback");
    feedback.className=`feedback ${correct?"good":"bad"}`;
    const classHtml=c.classical
      ? `<p><strong>Classical conditioning is present.</strong></p><ul>${["NS","UCS","UCR","CS","CR"].map(k=>`<li><strong>${k}:</strong> ${escapeHtml(c.cmap[k])}</li>`).join("")}</ul>`
      : `<p><strong>Classical conditioning:</strong> Not supported by the evidence in this case.</p>`;
    feedback.innerHTML=`<h3>${correct?"Complete analysis":"Compare your analysis"}</h3>
      <p><strong>Antecedent:</strong> ${escapeHtml(c.A)}</p>
      <p><strong>Behavior:</strong> ${escapeHtml(c.B)}</p>
      <p><strong>Consequence:</strong> ${escapeHtml(c.C)}</p>
      ${classHtml}
      <p><strong>Operant processes supported:</strong> ${c.operant.map(escapeHtml).join(", ")}</p>
      <p><strong>Why:</strong> ${escapeHtml(c.why)}</p>`;
    document.querySelectorAll(".pick-card").forEach(el=>el.disabled=true);
  } else {
    if(selected===null){
      attempts--;
      alert("Choose an answer first.");
      return;
    }
    correct=selected===currentPrompt.correct;
    if(correct) score++;
    document.querySelectorAll(".option").forEach(btn=>{
      if(btn.dataset.value===currentPrompt.correct) btn.classList.add("correct");
      else if(btn.dataset.value===selected) btn.classList.add("incorrect");
      btn.disabled=true;
    });
    const feedback=document.getElementById("feedback");
    feedback.className=`feedback ${correct?"good":"bad"}`;
    if(currentMode==="operant"){
      feedback.innerHTML=`<h3>${correct?"Correct":"Review it"}</h3>
        <p><strong>Best answer:</strong> ${escapeHtml(currentPrompt.correct)}</p>
        <p>${escapeHtml(c.why)}</p>`;
    }else{
      feedback.innerHTML=`<h3>${correct?"Correct":"Review it"}</h3>
        <p><strong>Antecedent:</strong> ${escapeHtml(c.A)}</p>
        <p><strong>Behavior:</strong> ${escapeHtml(c.B)}</p>
        <p><strong>Consequence:</strong> ${escapeHtml(c.C)}</p>
        <p class="small">Remember: antecedent = what happens right before; behavior = the observable action; consequence = what happens immediately after.</p>`;
    }
  }

  document.getElementById("scoreLabel").textContent=`Score: ${score}/${attempts}`;
  document.getElementById("checkBtn").classList.add("hidden");
  document.getElementById("nextBtn").classList.remove("hidden");
  document.getElementById("progressBar").style.width=`${((index+1)/deck.length)*100}%`;
}

function nextCase(){
  index++;
  if(index>=deck.length){
    showFinish();
  }else{
    renderCase();
  }
}

function showFinish(){
  const pct=attempts?Math.round((score/attempts)*100):0;
  document.getElementById("caseNumber").textContent="Practice complete";
  document.getElementById("caseTitle").textContent="Round finished";
  document.getElementById("caseText").innerHTML=`You completed all ${deck.length} cases in this mode.`;
  document.getElementById("classicalArea").classList.add("hidden");
  document.getElementById("mcArea").classList.remove("hidden");
  document.getElementById("mcArea").innerHTML=`<h2>${score}/${attempts} correct (${pct}%)</h2>
    <p>Restart this mode for a new randomized order and newly shuffled answer choices.</p>`;
  document.getElementById("feedback").classList.add("hidden");
  document.getElementById("checkBtn").classList.add("hidden");
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("progressBar").style.width="100%";
  const restart=document.createElement("button");
  restart.className="action";
  restart.textContent="Practice this mode again";
  restart.onclick=()=>startMode(currentMode);
  document.getElementById("mcArea").appendChild(restart);
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>
</body>
</html>
